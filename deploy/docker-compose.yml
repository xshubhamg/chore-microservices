name: chore

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &app-env
    ENV: dev
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    OTEL_EXPORTER_OTLP_INSECURE: "true"
    OTEL_SAMPLE_RATIO: "1"
    RABBITMQ_URL: amqp://chore:chore@rabbitmq:5672/
    RABBITMQ_EXCHANGE: chore.events
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chore
      POSTGRES_PASSWORD: chore
      POSTGRES_DB: chore
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chore -d chore"]
      interval: 2s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: chore
      RABBITMQ_DEFAULT_PASS: chore
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: catalog
    environment:
      <<: *app-env
      DATABASE_URL: postgres://chore:chore@postgres:5432/chore_catalog?sslmode=disable
      HTTP_ADDR: :8080
      ADMIN_ADDR: :9090
      GRPC_ADDR: :50051
    ports:
      - "3002:8080"
      - "9092:9090"

  booking:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: booking
    environment:
      <<: *app-env
      DATABASE_URL: postgres://chore:chore@postgres:5432/chore_booking?sslmode=disable
      HTTP_ADDR: :8080
      ADMIN_ADDR: :9090
      CATALOG_GRPC_ADDR: catalog:50051
    ports:
      - "3001:8080"
      - "9091:9090"
    depends_on:
      catalog:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification:
    <<: *app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: notification
    environment:
      <<: *app-env
      DATABASE_URL: postgres://chore:chore@postgres:5432/chore_notification?sslmode=disable
      ADMIN_ADDR: :9090
    ports:
      - "9093:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - catalog
      - booking
      - notification

volumes:
  postgres_data:
  rabbitmq_data:
